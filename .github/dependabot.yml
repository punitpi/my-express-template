version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 15
    groups:
      npm-dependencies:
        patterns:
          - "*"
        applies-to: version-updates
      npm-security-updates:
        patterns:
          - "*"
        applies-to: security-updates

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 15
    groups:
      github-actions:
        patterns:
          - "*"
